name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # Windows is listed first: it is the platform most downloads land on,
      # so its job should be the first to get a runner.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: saishin.exe
            # platform and arch go into the artifact name, spelled the way the
            # names of the release bundles are spelled.
            platform: windows
            arch: x64
          - os: ubuntu-latest
            binary: saishin
            platform: linux
            arch: x64
          - os: macos-latest
            binary: saishin
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Cargo.toml holds the version, so the artifact names match the binary's
      # own -V output and the tags cut with scripts/release.
      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          test -n "$version" || { echo "::error::No version = \"...\" in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built saishin $version" >> "$GITHUB_STEP_SUMMARY"

      # Cargo and target/ caches keyed on Cargo.lock: a push that does not
      # change dependencies reuses the whole dependency build.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: saishin-v1

      # keyring needs D-Bus, glow/glutin needs EGL/GLX, reqwest needs OpenSSL.
      # winit's wayland-dlopen feature loads libwayland at runtime, so the
      # wayland headers are not needed at build time.
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libssl-dev pkg-config \
            libegl1-mesa-dev libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      # --locked fails if Cargo.lock is missing or out of date, so the
      # committed lockfile stays the single source of truth.
      - name: Build
        run: cargo build --locked --release

      # The name is the whole identity of the build in one string: version from
      # Cargo.toml, six characters of the commit, the CI run number as the build
      # number (Actions has no separate build counter; the run number is the #NN
      # in the run list), platform and architecture. build.rs stamps its sha from
      # the same GITHUB_SHA, so the six characters here are the first six of the
      # sha `-V` prints. On a pull request both are the merge commit, so the two
      # never disagree.
      - name: Name the artifact
        id: name
        shell: bash
        run: |
          sha="${GITHUB_SHA:0:6}"
          if [ "${#sha}" -ne 6 ]; then
            echo "::error::GITHUB_SHA is not a commit sha: '$GITHUB_SHA'"
            exit 1
          fi
          stem="saishin-${{ steps.version.outputs.version }}-${sha}-r${GITHUB_RUN_NUMBER}-${{ matrix.platform }}-${{ matrix.arch }}"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "- $stem.zip" >> "$GITHUB_STEP_SUMMARY"

      # The binary and the annotated sample configuration, zipped under the name
      # the job just picked. The artifact gets that same name, and GitHub hands
      # out an artifact as a zip named after the artifact, so the file that
      # arrives in the browser is named exactly like the artifact.
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          STEM: ${{ steps.name.outputs.stem }}
          BINARY: ${{ matrix.binary }}
        run: |
          Move-Item -Path config.ini.example -Destination config.ini.template
          & "target/release/$env:BINARY" -V
          Compress-Archive -Path "target/release/$env:BINARY",config.ini.template -DestinationPath "${env:STEM}.zip"

      - name: Package
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          STEM: ${{ steps.name.outputs.stem }}
          BINARY: ${{ matrix.binary }}
        run: |
          cp config.ini.example config.ini.template
          "./target/release/$BINARY" -V
          # -j: the two files go into the root of the zip, not under target/.
          zip -X -q -j "$STEM.zip" "target/release/$BINARY" config.ini.template

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.stem }}
          path: ${{ steps.name.outputs.stem }}.zip
          if-no-files-found: error

  icon:
    # The Windows executable embeds saishin-png-icon-set/saishin.ico, which is
    # generated from the masters. Regenerate it here and fail if the
    # committed .ico differs, so artwork changes can never be forgotten.
    name: icon freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - run: python3 saishin-png-icon-set/make_saishin_ico.py
      - run: git diff --exit-code -- saishin-png-icon-set/saishin.ico
