[package]
name = "saishin"
version = "1.0.0"
edition = "2021"
description = "Keep files up to date from official GitHub releases, actions or any other URL, using an INI configuration file"
license = "MIT"

[[bin]]
name = "saishin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-ini = "0.21"
# Only deflate/stored archives are read; that keeps bzip2, lzma, zstd and the
# AES stack out of the build.
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rpassword = "7"
url = "2"
futures-util = "0.3"
# eframe's default renderer is wgpu, which drags in naga, ash, gpu-allocator
# and friends. This app draws a grid, so the glow (OpenGL) renderer is enough.
# system_fonts stays on: the header kanji are outside egui's bundled font, and
# this is the feature that lets eframe ask the system for a font carrying them.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "glow",
    "x11",
    "wayland",
] }
# Cargo cannot enable features of a transitive dependency, so eframe's
# `winit/default` is re-declared here: the same list winit ships as default.
winit = { version = "0.30", features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }

[build-dependencies]
# Decodes and shrinks the header logo, which src/gui.rs embeds as raw RGBA8, so
# no image decoder is linked into the binary.
png = "0.18"

# Platform credential stores: Credential Manager on Windows, Keychain on
# macOS, Secret Service on Linux. Without these the keyring crate silently
# falls back to an in-memory mock store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
